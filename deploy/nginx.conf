# Nginx site for the Next.js app. Install with:
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/ugurklimavent
#   sudo ln -sf /etc/nginx/sites-available/ugurklimavent /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d klimavent.az -d www.klimavent.az
#
# This is the file as it stands BEFORE certbot. Certbot then edits the copy in
# /etc/nginx in place — adds the 443 listener, the certificate paths and the
# http→https redirect, all marked `# managed by Certbot` — so the server's copy
# is expected to differ from this one afterwards. Re-copying this file over it
# would drop HTTPS; re-run the certbot line above if that ever happens.
#
# No `default_server` here, on purpose. The box hosts several sites, and
# `000-catchall` owns :80/:443 for any host that matches none of them, so a bare
# IP or a stray domain gets a closed connection instead of this site.
server {
    listen 80;
    listen [::]:80;
    server_name klimavent.az www.klimavent.az;

    # Icon uploads are capped at 512 KB in the action; this is headroom.
    client_max_body_size 8M;

    # Ubuntu's default gzips text/html only, and /_next/static is served by
    # nginx directly rather than through Next, so the JS and CSS need this.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Build output — hashed filenames, so it can be cached forever.
    location /_next/static/ {
        alias /srv/apps/ugurklimavent/.next/static/;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Icons uploaded through the admin panel.
    #
    # Serving these off disk is not only about speed: Next builds its list of
    # `/public` files when the process starts, so an icon uploaded while the
    # site is running would 404 until the next restart. Nginx reads the
    # directory on every request and does not have that gap.
    #
    # The two headers are NOT optional. They are the same ones `next.config.ts`
    # sets for this path, and bypassing Next means Next can no longer set them:
    # an SVG is a document as well as an image, so a file opened directly at
    # /uploads/... would otherwise run its own script in this origin. `sandbox`
    # denies it a script context; `nosniff` stops a mistyped upload being
    # re-read as HTML. Keep these in step with `next.config.ts`.
    location /uploads/ {
        alias /srv/apps/ugurklimavent/public/uploads/;
        try_files $uri @app;
        add_header Content-Security-Policy "sandbox";
        add_header X-Content-Type-Options "nosniff";
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # `$http_host`, not `$host`: `$host` drops the port, which matters the
        # moment the site is ever served on a non-default one.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    location @app {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }
}
